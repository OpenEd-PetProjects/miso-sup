[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "miso-sup"
version = "0.1.0"
description = "FastAPI service for the miso-sup project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn>=0.30,<0.31",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<0.28",
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
